[package]
name = "mkk_basis"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
sqlx = { version = "0.9.0", features = ["postgres", "chrono", "runtime-tokio", "macros", "uuid"] }
serde = { version = "1.0.228", features = ["derive"] }
config = "0.15.25"
tokio = { version = "1.52.3", features = ["full"] }
clap = { version = "4.6.1", features = ["derive"] }
log = "0.4.33"
axum = "0.8.9"
serde_json = "1.0.151"
env_logger = "0.11.11"
reqwest = { version = "0.13.4", features = ["form", "json"] }
tower-http = { version = "0.7.0", features = ["fs"] }
argon2 = { version = "0.5.3", features = ["std"] }
email_address = "0.2.9"
http = "1.5.0"
ctor = "1.0.12"
thiserror = "2.0.20"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
rand = "0.10.2"
rcgen = "0.14.9"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
rustls = "0.23.43"
rustls-pemfile = "2.2.0"
lettre = "0.11.23"
# fake = { version = "5.1.0", features = ["derive", "chrono", "uuid"] }
