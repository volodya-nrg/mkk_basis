[package]
name = "mkk_basis"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1.24.0", features = ["v4"] }
chrono = "0.4.45"
sqlx = { version = "0.9.0", features = ["postgres", "chrono", "runtime-tokio", "macros"] }
serde = "1.0.228"
config = "0.15.25"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
clap = { version = "4.6.1", features = ["derive"] }
log = "0.4.33"
axum = "0.8.9"
serde_json = "1.0.151"
json_env_logger = { version = "0.1.1", features = ["iso-timestamps"] }
env_logger = "0.11.11"